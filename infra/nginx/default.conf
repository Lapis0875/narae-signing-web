log_format token_route '$remote_addr - [$time_local] "$request_method <token-route> $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52500000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Narae-Client-IP $http_x_narae_client_ip;

    error_page 413 = @request_too_large;
    location @request_too_large {
        internal;
        default_type application/json;
        return 413 '{"code":"request_too_large"}';
    }

    location = /health { proxy_pass http://backend:8080/health; }
    location ~ ^/api/v1/admin/boards/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
    location ~ ^/api/v1/admin/boards/[^/]+/background$ {
        client_max_body_size 52500000;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
    }
    location ~ ^/api/v1/admin/boards/[^/]+/roster/import$ {
        client_max_body_size 1065000;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
    }
    location ~ ^/api/v1/admin/boards/[^/]+/roster$ {
        client_max_body_size 1048576;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
    }
    location = /api/v1/public/signing-session/signature {
        client_max_body_size 1048576;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
        add_header Referrer-Policy no-referrer always;
    }
    location = /api/v1/public/signing-session/draft {
        client_max_body_size 1048576;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
        add_header Referrer-Policy no-referrer always;
    }
    location = /api/v1/auth/login {
        client_max_body_size 16384;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
    }
    location ~ ^/api/v1/public/links/[^/]+/identify$ {
        access_log /var/log/nginx/token-access.log token_route;
        error_log /dev/null crit;
        client_max_body_size 16384;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/api/v1/public/links/[^/]+/display/events$ {
        access_log /var/log/nginx/token-access.log token_route;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/api/v1/public/links/[^/]+(?:/.*)?$ {
        access_log /var/log/nginx/token-access.log token_route;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        add_header Referrer-Policy no-referrer always;
    }
    location /api/ {
        client_max_body_size 65536;
        proxy_request_buffering on;
        proxy_pass http://backend:8080;
    }
    location ~ ^/sign/[^/]+$ {
        access_log /var/log/nginx/token-access.log token_route;
        error_log /dev/null crit;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }
    location ~ ^/display/[^/]+$ {
        access_log /var/log/nginx/token-access.log token_route;
        error_log /dev/null crit;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
